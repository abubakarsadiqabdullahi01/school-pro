# Local development database only — production runs on cPanel MySQL.
# Start with:  docker compose up -d
# Stop with:   docker compose down        (add -v to also delete the data)
services:
  mysql:
    image: mysql:8.0
    container_name: school-pro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: school_pro
      MYSQL_USER: school
      MYSQL_PASSWORD: devpass
    ports:
      # Host 3307 -> container 3306, so this never collides with a local MySQL.
      - "3307:3306"
    command:
      # Match the collation cPanel generates, so case-insensitive search
      # behaves identically here and in production.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # cPanel's MySQL authenticates with the native plugin; MySQL 8's default
      # is caching_sha2_password, which the MariaDB driver cannot complete over
      # a plaintext connection unless the server has the account cached. That
      # cache is lost on every container restart, so the first connection after
      # one failed with ER_CANNOT_RETRIEVE_RSA_KEY and the Prisma pool timed out
      # having created nothing. Matching production removes the difference.
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - school-pro-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdevroot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Production-like local edge. It proxies to the Next.js process running on
  # the Windows host, while keeping the database-only default unchanged.
  nginx:
    image: nginx:1.27-alpine
    container_name: school-pro-nginx
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  school-pro-db:
