# Local development database only — production runs on cPanel MySQL.
# Start with:  docker compose up -d
# Stop with:   docker compose down        (add -v to also delete the data)
services:
  mysql:
    image: mysql:8.0
    container_name: school-pro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: school_pro
      MYSQL_USER: school
      MYSQL_PASSWORD: devpass
    ports:
      # Host 3307 -> container 3306, so this never collides with a local MySQL.
      - "3307:3306"
    command:
      # Match the collation cPanel generates, so case-insensitive search
      # behaves identically here and in production.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - school-pro-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdevroot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  school-pro-db:
