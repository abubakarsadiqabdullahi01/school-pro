upstream schoolpro_next {
    server host.docker.internal:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Match the application webhook intake ceiling. Oversized requests are
    # rejected at the edge before they consume application resources.
    client_max_body_size 1m;

    location / {
        proxy_pass http://schoolpro_next;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required by the Next.js development server and harmless for the
        # production standalone server.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Preserve the exact request bytes used by Paystack's HMAC signature and
    # avoid buffering a payment acknowledgement at the proxy.
    location ^~ /api/webhooks/paystack {
        proxy_pass http://schoolpro_next;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}
